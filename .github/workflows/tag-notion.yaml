name: Append Label Hashtags to Issue and PR Bodies

on:
  issues:
    types:  [labeled, unlabeled]
  pull_request:
    types:  [labeled, unlabeled]

jobs:
  tag-to-body:
    runs-on: ubuntu-latest
    steps:
      - name: Add hashtags to issue/PR body
        uses: actions/github-script@v7
        with:
          script: |
            const isPR = !!context.payload.pull_request;
            const item = isPR ? context.payload.pull_request : context.payload.issue;
            const number = item.number;
            const { owner, repo } = context.repo;

            // Get latest labels
            const labels = item.labels.map(label => typeof label === 'string' ? label : label.name);
            const hashtags = labels.map(label => `tag:${label.replace(/\s+/g, '_')}`).join(';');

            // Fetch the latest issue/PR to get the full body
            const apiMethod = isPR ? github.rest.pulls.get : github.rest.issues.get;
            const { data } = await apiMethod({ owner, repo, pull_number: number, issue_number: number });

            const body = data.body || '';

            // Remove existing tag block
            const cleanedBody = body.replace(/<!-- TAGS START -->[\s\S]*?<!-- TAGS END -->/gm, '').trim();

            const newBody = `${cleanedBody}

            <!-- TAGS START -->
            Tags for Notion Integration:
            ${hashtags}
            <!-- TAGS END -->
            `;

            // Update either the PR or Issue body
            if (isPR) {
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: number,
                body: newBody
              });
            } else {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: number,
                body: newBody
              });
            }

            console.log(`✅ Updated ${isPR ? 'PR' : 'Issue'} #${number}`);
