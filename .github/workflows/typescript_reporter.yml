name: React Build with Reviewdog

on:
  pull_request:
    
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16' # Match your project's Node.js version

      - name: Install dependencies
        working-directory: src/ros/nova-gui/nova-gui
        run: yarn install

      - name: Run build
        id: build
        working-directory: src/ros/nova-gui/nova-gui
        run: |
          yarn build 2> build_errors.txt || true

      - name: Install reviewdog
        uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest

      - name: Run reviewdog for build errors
        if: always()
        working-directory: src/ros/nova-gui/nova-gui
        run: |
          cat build_errors.txt | reviewdog -f=checkstyle \
            -name="React Build Errors" \
            -reporter=github-pr-check \
            -level=error


