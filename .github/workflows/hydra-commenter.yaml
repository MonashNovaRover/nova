name: Hydra Commenter 🐍

on:
  pull_request:

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Comment PR
        uses: thollander/actions-comment-pull-request@v3
        with:
          message: |
            You can find the hydra build for this PR at this link:
            https://hydra.novarover.space/jobset/nova/workspaces-pr-nova-${{ github.event.pull_request.number }}

            Username: `nova`
            Password: https://github.com/MonashNovaRover/secrets/blob/master/hydra-password.txt
            
