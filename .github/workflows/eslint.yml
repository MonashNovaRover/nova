name: eslint 🐶

on:
  pull_request:
    paths:
      - 'src/ros/nova-gui/nova-gui/**'  # Only run when files in the nova-gui folder change
  push:
    branches:
      - main                            # and on pushes to the main branch

jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: src/ros/nova-gui/nova-gui
        run: yarn install

      # Option 1 - will run eslint over the whole project and display all issues
      - name: yarn lint
        working-directory: src/ros/nova-gui/nova-gui
        run: yarn lint

      # Option 2 - will only display issues that were generated from the raised PR
#      - uses: reviewdog/action-eslint@v1
#        with:
#          reporter: github-check
#          workdir: 'src/ros/nova-gui/nova-gui'
