# gz gps to ros
- ros_topic_name: "/fix" # guessing this one could also be /gps_plugin/vel ?
  gz_topic_name: "/gps"
  ros_type_name: "sensor_msgs/msg/NavSatFix" # or "gps_msgs/msg/GPSFix" ?
  gz_type_name: "gz.msgs.NavSat"
  direction: GZ_TO_ROS

# gz pose to ros
- ros_topic_name: "/odom/gazebo"
  gz_topic_name: "/model/Rover7/pose"
  ros_type_name: "geometry_msgs/msg/Pose"
  gz_type_name: "gz.msgs.Pose"
  direction: GZ_TO_ROS

# gz odom to ros
- ros_topic_name: "/odom"
  gz_topic_name: "/odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

# gz dynamic joint states to ros
- ros_topic_name: "/joint_states"
  gz_topic_name: "/joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

- ros_topic_name: "/joint_states"
  gz_topic_name: "/arm/joints_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS
