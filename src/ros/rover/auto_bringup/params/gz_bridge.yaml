# gz clock to ros 
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS # BIDIRECTIONAL or ROS_TO_GZ

# gz oak depth image to ros 
- ros_topic_name: "/oak/depth"
  gz_topic_name: "/oak/depth"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

# gz oak rgb image to ros
- ros_topic_name: "/oak/rgb/image_rect"
  gz_topic_name: "/oak/rgb"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

# gz imu to ros
- ros_topic_name: "/oak/imu/transformed"
  gz_topic_name: "/oak/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

# gz pointcloud to ros
- ros_topic_name: "/oak/depth/points"
  gz_topic_name: "/oak/depth/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS

# gz gps to ros
- ros_topic_name: "/fix" # guessing this one could also be /gps_plugin/vel ?
  gz_topic_name: "/gps"
  ros_type_name: "sensor_msgs/msg/NavSatFix" # or "gps_msgs/msg/GPSFix" ?
  gz_type_name: "gz.msgs.NavSat"
  direction: GZ_TO_ROS

# gz pose to ros
- ros_topic_name: "/odom/gazebo"
  gz_topic_name: "/model/Rover7/pose"
  ros_type_name: "geometry_msgs/msg/Pose"
  gz_type_name: "gz.msgs.Pose"
  direction: GZ_TO_ROS

# gz odom to ros
- ros_topic_name: "/odom"
  gz_topic_name: "/odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

# gz dynamic joint states to ros
- ros_topic_name: "/joint_states"
  gz_topic_name: "/dynamic_joints"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS