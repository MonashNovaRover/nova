# gz oak stereo camera to ros
- ros_topic_name: "/oak/stereo/image_rect"
  gz_topic_name: "/oak/stereo"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS  # BIDIRECTIONAL or ROS_TO_GZ

# gz oak rgb camera to ros
- ros_topic_name: "/oak/rgb/image_rect"
  gz_topic_name: "/oak/rgb"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

# gz imu to ros
- ros_topic_name: "/oak/imu/transformed"
  gz_topic_name: "/oak/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

# gz pointcloud to ros
- ros_topic_name: "/oak/points"
  gz_topic_name: "/oak/stereo/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS

# gz gps to ros
- ros_topic_name: "/fix" # guessing this one could also be /gps_plugin/vel ?
  gz_topic_name: "/gps"
  ros_type_name: "sensor_msgs/msg/NavSatFix" # or "gps_msgs/msg/GPSFix" ?
  gz_type_name: "gz.msgs.NavSat"
  direction: GZ_TO_ROS

# gz p3d to ros
- ros_topic_name: "/odom/gazebo"
  gz_topic_name: "/model/Waratah/pose"
  ros_type_name: "geometry_msgs/msg/Pose"
  gz_type_name: "gz.msgs.Pose"
  direction: GZ_TO_ROS