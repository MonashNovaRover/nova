# Params for RTABMap SLAM
rtabmap_slam:
  ros__parameters:
    frame_id: base_link
    publish_tf: True
    subscribe_rgb: False
    subscribe_depth: False
    subscribe_rgbd: True
    rgbd_cameras: 1
    subscribe_odom_info: False
    approx_sync: True
    odom_frame_id: odom
    Rtabmap/DetectionRate: "3.0"
    sync_queue_size: 40
    topic_queue_size: 40
# Params for RGBD Odom (VO)
rtabmap_odom:
  ros__parameters:
    publish_tf: False
    publish_null_when_lost: False
    subscribe_rgbd: true
    rgbd_cameras: 1
