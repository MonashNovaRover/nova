      stvl_layer: # From https://github.com/SteveMacenski/spatio_temporal_voxel_layer/blob/ros2/spatio_temporal_voxel_layer/example/outdoor_environment_config.yaml
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled:                  true
        voxel_decay:              30.0  # seconds if linear, e^n if exponential
        decay_model:              0     # 0=linear, 1=exponential, -1=persistent
        voxel_size:               0.1   # meters, must match generated voxel size in pointcloud
        track_unknown_space:      true  # default space is known
        mark_threshold:           0     # voxel height
        update_footprint_enabled: true
        combination_method:       1     # 1=max, 0=override
        origin_z:                 0.0   # meters
        publish_voxel_map:        false # default off
        transform_tolerance:      0.3   # seconds
        mapping_mode:             false # default off, saves map not for navigation
        map_save_duration:        60.0  # default 60s, how often to autosave, un-needed since not mapping
        observation_sources: oak bootie
        oak:
          data_type: PointCloud2
          topic: /oak/points
          # Marking params
          marking: true                # enable marking using this source
          obstacle_range: 5.0          # meters
          min_obstacle_height: 0.2     # meters
          max_obstacle_height: 2.0     # meters
          # expected_update_rate: 0.0    # default 0, if not updating at this rate at least, remove from buffer
          # observation_persistence: 0.0 # default 0, use all measurements taken during now-value, 0=latest
          # inf_is_valid: false          # default false, for laser scans
          # filter: "passthrough"        # default passthrough, use voxel if cpu usage is too high
          # voxel_min_points: 0          # default 0, minimum points per voxel for voxel filter
          # clear_after_reading: false   # default false, clear the buffer after the layer gets readings from it
          # Clearing params
          clearing: true                # enable clearing using this source
          min_z: 0.2                    # meters
          max_z: 2.0                    # meters
          vertical_fov_angle: 0.977384  # fov of camera, radians
          horizontal_fov_angle: 1.43117 # fov of camera, radians
          decay_acceleration: 1.0       # default 0, 1/s^2. If laser scanner MUST be 0
          model_type: 0                 # default 0, model type for frustum. 0=depth camera, 1=3d lidar like VLP16 or similar
        bootie:
          data_type: PointCloud2
          topic: /bootie/points
          # Marking params
          marking: true                # enable marking using this source
          obstacle_range: 5.0          # meters
          min_obstacle_height: 0.2     # meters
          max_obstacle_height: 2.0     # meters
          # Clearing params
          clearing: true
          min_z: 0.2
          max_z: 2.0
          vertical_fov_angle: 0.977384
          horizontal_fov_angle: 1.43117
          decay_acceleration: 1.0
          model_type: 0


planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    use_sim_time: False
    planner_plugins: ["GridBased"]

    GridBased:
      allow_reverse_expansion: false  # If true, allows the robot to use the primitives to expand in the mirrored opposite direction of the current robot's orientation (to
                                      # reverse).
      allow_unknown: true # Allow traveling in unknown space
      analytic_expansion_max_cost: 200.0 # The maximum single cost for any part of an analytic expansion to contain and be valid, except when necessary on approach to goal
      analytic_expansion_max_cost_override: true # Whether or not to override the maximum cost setting if within critical distance to goal.
      analytic_expansion_max_length: 3.0 # For Hybrid/Lattice nodes The maximum length of the analytic expansion to be considered valid to prevent unsafe shortcutting
      analytic_expansion_ratio: 3.5 # The ratio to attempt analytic expansions during search for final approach.
      cache_obstacle_heuristic: true  # Cache the obstacle map dynamic programming distance expansion heuristic between subsequent replannings of the same goal location.
                                      # Dramatically speeds up replanning performance (40x) if costmap is largely static.
      change_penalty: 5.0 # Penalty to apply if motion is changing directions (L to R), must be >= 0
      cost_penalty: 8.0 # Penalty to apply to higher cost areas when adding into the obstacle map dynamic programming distance expansion heuristic. This drives
                        # the robot more towards the center of passages. A value between 1.3 - 3.5 is reasonable.
      debug_visualizations: false # For Hybrid/Lattice nodes: Whether to publish expansions on the /expansions topic as an array of poses (the orientation has no meaning)
                                  # and the path's footprints on the /planned_footprints topic. WARNING: heavy to compute and to display, for debug only as it degrades the
                                  # performance.
      lattice_filepath: "/home/nova/nova/src/ros/rover/auto_bringup/params/state_lattice.json" # The filepath to the state lattice graph
      lookup_table_size: 20.0 # Size of the dubin/reeds-sheep distance window to cache, in meters.
      max_iterations: 1000000 # Maximum total iterations to search for before failing (in case unreachable), set to -1 to disable
      max_on_approach_iterations: 1000 # Maximum number of iterations after within tolerances to continue to try to find exact solution
      max_planning_time: 5.0 # Max time in s for planner to plan, smooth
      non_straight_penalty: 1.2 # Penalty to apply if motion is non-straight, must be => 1
      plugin: "nav2_smac_planner::SmacPlannerLattice"
      retrospective_penalty: 0.005  # For Hybrid/Lattice nodes: penalty to prefer later maneuvers before earlier along the path. Saves search time since earlier nodes are not
                                    # expanded until it is necessary. Must be >= 0.0 and <= 1.0
      reverse_penalty: 10.0 # Penalty to apply if motion is reversing, must be => 1
      rotation_penalty: 5.0 # Penalty to apply to in-place rotations, if minimum control set contains them
      smooth_path: True # If true, does a simple and quick smoothing post-processing to the path
      smoother:
        do_refinement: true # Whether to recursively run the smoother 3 times on the results from prior runs to refine the results further
        max_iterations: 1000
        refinement_num: 2
        tolerance: 1.0e-10
        w_data: 0.2
        w_smooth: 0.3
      terminal_checking_interval: 5000 # Number of iterations between checking if the goal has been cancelled or planner timed out
      tolerance: 0.25 # dist-to-goal heuristic cost (distance) for valid tolerance endpoints if exact goal cannot be found.

    NavFn:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: true
      allow_unknown: true

smoother_server:
  ros__parameters:
    costmap_topic: global_costmap/costmap_raw
    footprint_topic: global_costmap/published_footprint
    robot_base_frame: base_link
    transform_timeout: 0.1
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      do_refinement: True
      refinement_num: 2
      max_its: 1000
      w_data: 0.2
      w_smooth: 0.3

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins:
      ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    enable_stamped_cmd_vel: True
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.4
    min_rotational_vel: 0.1
    rotational_acc_lim: 0.1

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: False
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 3.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.12, 0.0, 0.12]
    min_velocity: [-0.12, 0.0, -0.12]
    max_accel: [0.05, 0.0, 0.03]
    max_decel: [-0.05, 0.0, -0.03]
    odom_topic: /odometry/local
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
    enable_stamped_cmd_vel: True