bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/global 
    bt_loop_duration: 30
    default_server_timeout: 60000
    wait_for_service_timeout: 1000
    action_service_result_timeout: 900.0
    goal_reached_tol: 1.0
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code
    navigators: ["navigate_to_pose", "navigate_through_poses"] #, "urc_navigator"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    default_nav_through_poses_bt_xml: /home/nova/nova/src/ros/rover/nav2_autonomous/nova_behavior_tree/behavior_tree/arch/2025_arch_through_poses.xml
    # $(find-pkg-share my_package)/behavior_tree/my_nav_through_poses_bt.xml
    urc_navigator:
      plugin: "nova_bt_navigators::URCNavigator"
    plugin_lib_names:
      - nova_ar_tag_detected_condition_bt_node
      - nova_blackboard_publisher_bt_node
      - nova_run_scripts_action_bt_node
      - nova_check_detected_condition_bt_node
      - nova_compute_search_goals_condition_bt_node
      - nova_cube_detected_condition_bt_node
      - nova_first_goal_reached_condition_bt_node
      - nova_get_final_goal_condition_bt_node
      - nova_get_first_goal_condition_bt_node
      - nova_goals_empty_condition_bt_node
      - nova_led_service_bt_node
      - nova_query_position_condition_bt_node
      - nova_remove_passed_goals_and_cubes_action_bt_node
      - nova_update_goal_action_bt_node
      - nova_update_goals_action_bt_node
      - nova_remove_passed_goals_and_ar_tags_action_bt_node
      - nova_snap_in_collision_goals_action_bt_node
      - nova_save_cube_poses_action_bt_node
      - nova_save_image_service_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: False

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 30.0
    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.001
    failure_tolerance: -1.0 # The maximum duration in seconds the called controller plugin can fail (i.e. the computeVelocityCommands function of the plugin
                            # throwing an exception) before the nav2_msgs::action::FollowPath action fails. Setting it to the special value of -1.0 makes it
                            # infinite, 0 to disable, and any positive value for the appropriate timeout.
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: False
    enable_stamped_cmd_vel: True
    odom_topic: /odometry/local
    progress_checker:
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.25
      required_movement_angle: 0.0
      movement_time_allowance: 30.0 # Maximum amount of time (sec) a robot has to move the minimum radius or the minimum angle.
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.5
      yaw_goal_tolerance: 0.523599 # 30 degrees in radians.
      stateful: false # Whether to check for XY position tolerance after rotating to goal orientation in case of minor localization changes.
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      vx_std: 0.2
      vy_std: 0.2
      wz_std: 0.4
      vx_max: 0.5
      vx_min: -0.35
      vy_max: 0.5
      wz_max: 1.9
      ax_max: 3.0
      ax_min: -3.0
      ay_min: -3.0
      ay_max: 3.0
      az_max: 3.5
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: false
      regenerate_noises: false
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      AckermannConstraints:
        min_turning_r: 0.2
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: false
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 2
        cost_weight: 5.0
        threshold_to_consider: 0.5
      ObstaclesCritic:
        enabled: false
        cost_power: 1
        repulsion_weight: 1.5
        critical_weight: 20.0
        consider_footprint: false
        collision_cost: 10000.0
        collision_margin_distance: 0.1
        near_goal_distance: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 2
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0
      VelocityDeadbandCritic:
        enabled: false
        cost_power: 1
        cost_weight: 35.0
        deadband_velocities: [0.05, 0.05, 0.05]
      TwirlingCritic:
        enabled: false
        twirling_cost_power: 1
        twirling_cost_weight: 10.0
    RPP:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.4 # The desired maximum linear velocity (m/s) to use.
      min_approach_linear_velocity: 0.1
      rotate_to_heading_angular_vel: 0.05 # If use_rotate_to_heading is true, this is the angular velocity to use.
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      transform_tolerance: 0.1
      use_velocity_scaled_lookahead_dist: false
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: false # Whether to enable collision detection.
      max_allowed_time_to_collision_up_to_carrot: 10.0 # The time (s) to project a velocity command forward to check for collisions when use_collision_detection is true.
      use_regulated_linear_velocity_scaling: true
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.25
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      use_rotate_to_heading:
        true # Whether to enable rotating to rough heading and goal orientation when using holonomic planners. Recommended on for all robot types
        # that can rotate in place. Note: both use_rotate_to_heading and allow_reversing cannot be set to true at the same time as it would
        # result in ambiguous situations.
      allow_reversing: false
      rotate_to_heading_min_angle:
        0.785398 # The difference in the path orientation and the starting robot orientation (radians) to trigger a rotate in place, if
        # use_rotate_to_heading is true. 45 degrees in radians.
      max_angular_accel: 3.2
      max_robot_pose_search_dist: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      enable: True
      update_frequency: 3.0
      publish_frequency: 3.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: False
      rolling_window: True
      width: 10
      height: 10
      origin_x: -5.0
      origin_y: -5.0
      resolution: 0.1
      # [x, y], where x is length and y is width
      # ([wheel_base, steering_track] / 2) + wheel_radius
      footprint: "[[0.64, 0.57], [0.64, -0.57], [-0.64, -0.57], [-0.64, 0.57]]"
      # retrieved by update_goals_action_bt_node (not actually used by planner)
      # sqrt((wheel_base / 2 + wheel_radius)^2 + (steering_track / 2 + wheel_radius)^2)
      robot_radius: 0.85
      track_unknown_space: False
      always_send_full_costmap: True
      plugins: ["stvl_layer", "denoise_layer", "inflation_layer"]
      denoise_layer:
        plugin: "nav2_costmap_2d::DenoiseLayer"
        enabled: True
        minimal_group_size: 3
        group_connectivity_type: 8
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 0.1
        inflation_radius: 0.7
      stvl_layer: # From https://github.com/SteveMacenski/spatio_temporal_voxel_layer/blob/ros2/spatio_temporal_voxel_layer/example/outdoor_environment_config.yaml
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled:                  true
        voxel_decay:              10.0  # seconds if linear, e^n if exponential
        decay_model:              0     # 0=linear, 1=exponential, -1=persistent
        voxel_size:               0.1   # meters, must match generated voxel size in pointcloud
        track_unknown_space:      true  # default space is known
        mark_threshold:           0     # voxel height
        update_footprint_enabled: true
        combination_method:       1     # 1=max, 0=override
        origin_z:                 0.0   # meters
        publish_voxel_map:        false # default off
        transform_tolerance:      0.2   # seconds
        mapping_mode:             false # default off, saves map not for navigation
        map_save_duration:        0.0   # default 60s, how often to autosave, uneeded since not mapping
        observation_sources: oak bootie
        oak:
          data_type: PointCloud2
          topic: /oak/points
          # Marking params
          marking: true                # enable marking using this source
          obstacle_range: 5.0          # meters
          min_obstacle_height: 0.2     # meters
          max_obstacle_height: 2.0     # meters
          # expected_update_rate: 0.0    # default 0, if not updating at this rate at least, remove from buffer
          # observation_persistence: 0.0 # default 0, use all measurements taken during now-value, 0=latest
          # inf_is_valid: false          # default false, for laser scans
          # filter: "passthrough"        # default passthrough, use voxel if cpu usage is too high
          # voxel_min_points: 0          # default 0, minimum points per voxel for voxel filter
          # clear_after_reading: false   # default false, clear the buffer after the layer gets readings from it
          # Clearing params
          clearing: true                # enable clearing using this source
          min_z: 0.2                    # meters
          max_z: 2.0                    # meters
          vertical_fov_angle: 0.977384  # fov of camera, radians
          horizontal_fov_angle: 1.43117 # fov of camera, radians
          decay_acceleration: 1.0       # default 0, 1/s^2. If laser scanner MUST be 0
          model_type: 0                 # default 0, model type for frustum. 0=depth camera, 1=3d lidar like VLP16 or similar
        bootie:
          data_type: PointCloud2
          topic: /bootie/points
          # Marking params
          marking: true                # enable marking using this source
          obstacle_range: 5.0          # meters
          min_obstacle_height: 0.2     # meters
          max_obstacle_height: 2.0     # meters
          clearing: true
          min_z: 0.2
          max_z: 2.0
          vertical_fov_angle: 0.977384
          horizontal_fov_angle: 1.43117
          decay_acceleration: 1.0
          model_type: 0

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 3.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: True
      # [x, y], where x is length and y is width
      # local_costmap footprint * 1.2
      footprint: "[[0.76, 0.68], [0.76, -0.68], [-0.76, -0.68], [-0.76, 0.68]]"
      resolution: 0.05
      track_unknown_space: false
      always_send_full_costmap: True
      plugins: ["static_layer", "stvl_layer", "denoise_layer", "inflation_layer"]
      denoise_layer:
        plugin: "nav2_costmap_2d::DenoiseLayer"
        enabled: True
        minimal_group_size: 3
        group_connectivity_type: 8
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
