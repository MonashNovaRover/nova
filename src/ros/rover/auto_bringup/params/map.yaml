# publishes to /map (and is remapped to /static_map in navigation.launch.py)
# subscribed to by global_costmap layer in the static_layer plugin under map_topic parameter

# Rover will always be spawned at 0,0 in 2D POSE (at least in gazebo, haven't tested IRL)
# Open picture in application that can view pixels, MS Paint for Windows or Pinta for Nixos (nix-shell -p pinta)
# To calculate the rover's position on the map image:
#   Pixel[x] = -1 * Origin[x] / resolution
#   Pixel[y] = -1 * height - (origin[y] / resolution)
# To place rover in specific spot on map image:
#   Choose pixel coordinates for rover, then follow this formula:
#   Origin[x] = -1 * pixel[x] * resolution
#   Origin[y] = -1 * (height - pixel[y]) * resolution
#   Where height is the height of the map image
#   Notice the difference between x and y's calculation.
# Yaw is the counterclockwise rotation of the rover in radians
# IMPORTANT! Yaw is ignored by the global costmap and rover will face the right side of the static map

# ARCh 2024
# image: ../maps/comp_map.png # Path to the image file containing the occupancy data; can be absolute, or relative to the location of the YAML file
# resolution: 0.400000        # Resolution of the map, meters / pixel
# origin: [-8.4, -21.2, 0]    # The 2-D pose of the lower-left pixel in the map, as (x, y, yaw), with yaw as counterclockwise rotation (yaw=0 means no rotation). Many parts of the system currently ignore yaw
# negate: 0                   # Whether the white/black free/occupied semantics should be reversed (interpretation of thresholds is unaffected)
# occupied_thresh: 0.65       # Pixels with occupancy probability greater than this threshold are considered completely occupied.
# free_thresh: 0.196          # Pixels with occupancy probability less than this threshold are considered completely free.

# clear map (no obstacles)
# image: ../maps/clear_map.png     
# resolution: 0.400000
# origin: [-8.4, -21.2, 0]
# negate: 0
# occupied_thresh: 0.65
# free_thresh: 0.196 

# 2025 Comp Sims
image: ../maps/comp_sim_ARCh_2025.png
resolution: 0.1 # 10 cm per pixel
origin: [-1, -5, 0]
negate: 0
occupied_thresh: 0.65
free_thresh: 0.196         