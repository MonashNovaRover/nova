planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    use_sim_time: False
    planner_plugins: ["GridBased"]

    SMAC:
      allow_reverse_expansion: false  # If true, allows the robot to use the primitives to expand in the mirrored opposite direction of the current robot's orientation (to
                                      # reverse).
      allow_unknown: true # Allow traveling in unknown space
      analytic_expansion_max_cost: 200.0 # The maximum single cost for any part of an analytic expansion to contain and be valid, except when necessary on approach to goal
      analytic_expansion_max_cost_override: true # Whether or not to override the maximum cost setting if within critical distance to goal.
      analytic_expansion_max_length: 1.0 # For Hybrid/Lattice nodes The maximum length of the analytic expansion to be considered valid to prevent unsafe shortcutting
      analytic_expansion_ratio: 3.5 # The ratio to attempt analytic expansions during search for final approach.
      cache_obstacle_heuristic: true  # Cache the obstacle map dynamic programming distance expansion heuristic between subsequent replannings of the same goal location.
                                      # Dramatically speeds up replanning performance (40x) if costmap is largely static.
      change_penalty: 5.0 # Penalty to apply if motion is changing directions (L to R), must be >= 0
      cost_penalty: 8.0 # Penalty to apply to higher cost areas when adding into the obstacle map dynamic programming distance expansion heuristic. This drives
                        # the robot more towards the center of passages. A value between 1.3 - 3.5 is reasonable.
      debug_visualizations: false # For Hybrid/Lattice nodes: Whether to publish expansions on the /expansions topic as an array of poses (the orientation has no meaning)
                                  # and the path's footprints on the /planned_footprints topic. WARNING: heavy to compute and to display, for debug only as it degrades the
                                  # performance.
      lattice_filepath: "/home/nova/nova/src/ros/rover/auto_bringup/params/nav2_urc/state_lattice.json" # The filepath to the state lattice graph
      lookup_table_size: 20.0 # Size of the dubin/reeds-sheep distance window to cache, in meters.
      max_iterations: 1000000 # Maximum total iterations to search for before failing (in case unreachable), set to -1 to disable
      max_on_approach_iterations: 1000 # Maximum number of iterations after within tolerances to continue to try to find exact solution
      max_planning_time: 5.0 # Max time in s for planner to plan, smooth
      non_straight_penalty: 1.0 # Penalty to apply if motion is non-straight, must be => 1
      plugin: "nav2_smac_planner::SmacPlannerLattice"
      retrospective_penalty: 0.005  # For Hybrid/Lattice nodes: penalty to prefer later maneuvers before earlier along the path. Saves search time since earlier nodes are not
                                    # expanded until it is necessary. Must be >= 0.0 and <= 1.0
      reverse_penalty: 10.0 # Penalty to apply if motion is reversing, must be => 1
      rotation_penalty: 1.0 # Penalty to apply to in-place rotations, if minimum control set contains them
      smooth_path: True # If true, does a simple and quick smoothing post-processing to the path
      smoother:
        do_refinement: true # Whether to recursively run the smoother 3 times on the results from prior runs to refine the results further
        max_iterations: 1000
        refinement_num: 2
        tolerance: 1.0e-10
        w_data: 0.2
        w_smooth: 0.3
      terminal_checking_interval: 5000 # Number of iterations between checking if the goal has been cancelled or planner timed out
      tolerance: 0.5 # dist-to-goal heuristic cost (distance) for valid tolerance endpoints if exact goal cannot be found.

    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 1.0
      use_astar: true
      allow_unknown: true
