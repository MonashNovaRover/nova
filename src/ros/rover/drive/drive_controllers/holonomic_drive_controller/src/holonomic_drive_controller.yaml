holonomic_drive_controller:
  infinitely_rotating_pivots:
    type: bool
    default_value: false
    description: "Enable use of infinitely rotating pivots"

  front_left_pivot_angle_limits:
    type: double_array
    default_value: [-0.8652479375127697, 2.2763447160770234] # [-PI/4, 3 * PI/4] radians
    description: "lower and upper limits on the front left pivot angle (ignored if infinitely_rotating_pivots is true)"

  front_right_pivot_angle_limits:
    type: double_array
    default_value: [-2.2763447160770234,  0.8652479375127697] # [-3 * PI/4, PI/4] radians
    description: "lower and upper limits on the front right pivot angle (ignored if infinitely_rotating_pivots is true)"

  back_left_pivot_angle_limits:
    type: double_array
    default_value: [-2.2763447160770234, 0.8652479375127697] # [-3 * PI/4, PI/4] radians
    description: "lower and upper limits on the back left pivot angle (ignored if infinitely_rotating_pivots is true)"

  back_right_pivot_angle_limits:
    type: double_array
    default_value: [-0.8652479375127697, 2.2763447160770234] # [-PI/4, 3 * PI/4] radians
    description: "lower and upper limits on the back right pivot angle (ignored if infinitely_rotating_pivots is true)"

  speed_multiplier_exponent:
    type: double
    default_value: 1.0
    description: "Increase to further decrease linear/angular velocities when pivots are misaligned (disable by setting to 0)"

  pivot_angle_leeway:
    type: double
    default_value: 0.0000000001
    description: "Angles are considered equivalent if they are at most this angle apart (aka 'epsilon')"

  pivot_limit_buffer:
    type: double
    default_value: 0.0
    description: "hotfix: stay at least this angle away from pivot limits"