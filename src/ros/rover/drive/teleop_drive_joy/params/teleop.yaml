# see teleop_drive_joy.yaml for descriptions given to options
teleop_drive_joy_node:
  ros__parameters:
    initial_speed: 0.1
    max_input_threshold: 0.97
    handbrake_speed_multiplier: 0.6
    trigger_pressed_threshold: 0.1

    autolock_enable: true
    autolock_threshold_error_count: 0
    autolock_threshold_error_duration: 2250
    autolock_error_active_duration: 500
    autolock_override: false  # only change dynamically via service call or command line (edit autolock_enable instead)

    lock_on_gamepad_disconnected: true
    gamepad_connection_timeout: 2000

    # continuous gamepad rumble settings
    continuous_rumble_enable: true
    continuous_rumble_joints: ["frw", "flw", "brw", "blw", "frp", "flp", "brp", "blp"]
    continuous_from_effort_range: [ 0.4, 1.0 ]
    continuous_to_intensity_range: [ 0.0101, 0.3 ]
    continuous_rumble_timeout: 5000
    continuous_timeout_intensity_change_per_second: -0.05

    # transient game pad rumble settings
    transient_rumble_enable: true
    transient_rumble_joints: [ "frw", "flw", "brw", "blw" ]
    transient_from_effort_change_range: [ 0.4, 0.6 ] #????????
    transient_to_intensity_range: [ 0.0101, 0.5 ] #????

    speed_limit_max: 1.0
    speed_limit_min: 0.05
    speed_change_coarse_val: 0.1
    speed_change_fine_val: 0.025

    input_topic: /drive/joy
    output_topic: /cmd_vel
    drive_info_topic: /drive/drive_info
    joint_states_topic: /drive/joint_states
    joy_feedback_topic: /drive/joy/set_feedback
    blcmd_log_topic: /drive/blcmd_log

    controllers:
      - pivot_drive_controller
      - ackermann_steering_controller
      - strafe_drive_controller
      - diff_drive_controller
    pivot_drive_controller:
      # angular input is limited to avoid having pivots rotate to their maximum position
      # (which currently causes them to "wrap around" to their minimum position instead)
      limit_angular: 0.999
      limit_linear: 1.0
      scale_angular: 1.0
      scale_linear: 1.0
    ackermann_steering_controller:
      limit_angular: 1.0
      limit_linear: 1.0
      scale_angular: 1.0
      scale_linear: 1.0
    strafe_drive_controller:
      limit_angular: 1.0
      limit_linear: 1.0
      scale_angular: 1.0
      scale_linear: 1.0
    diff_drive_controller:
      limit_angular: 1.0
      limit_linear: 1.0
      scale_angular: 1.0
      scale_linear: 1.0




