teleop_science:
  ros__parameters:

    input_sources:
      names: [
        "game_controller_source"
      ]

      # Declare types for the sources
      game_controller_source:
        type: "teleop_modular_joy/JoyInputSource"

game_controller_source:
  ros__parameters:
    topic: "/science/joy"
    # These are the default mappings for a game_controller_node.
    # https://docs.ros.org/en/ros2_packages/rolling/api/joy/index.html
    # If you use joy_node, you'll need to figure out what the mapping is yourself.
    # So, run joy, `ros2 topic echo /joy`, and mess around with your controller to figure out what it is for you.
    button_definitions: [
      "A",
      "B",
      "X",
      "Y",
      "BACK",
      "GUIDE",
      "START",
      "LEFTSTICK",
      "RIGHTSTICK",
      "LEFTSHOULDER",
      "RIGHTSHOULDER",
      "DPAD_UP",
      "DPAD_DOWN",
      "DPAD_LEFT",
      "DPAD_RIGHT",
      "MISC1",
      "PADDLE1",
      "PADDLE2",
      "PADDLE3",
      "PADDLE4",
      "TOUCHPAD"
    ]
    axis_definitions: [
      "LEFTX",
      "LEFTY",
      "RIGHTX",
      "RIGHTY",
      "TRIGGERLEFT",
      "TRIGGERRIGHT"
    ]

    remap:
      axes:
        auger_actuation:
          from: "RIGHTY"
        cbeam_actuation:
          from: "LEFTY"

      buttons:
        lock:
          from: "BACK"
        unlock:
          from: "START"
        sweeper_sweep:
          from: "A"
        twitch:
          from: "B"
        spinny_pos_1:
          from: "X"
        activate_auger:
          from: "DPAD_UP"
        activate_cbeam:
          from: "DPAD_LEFT"
