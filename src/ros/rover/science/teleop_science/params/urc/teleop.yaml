teleop_science:
  ros__parameters:
    # The maximum rate at which updates should occur, and hence the max rate at which commands are sent.
    # Leaving this unset makes the max update rate unlimited.
    # update_rate: 50.0

    # The minimum rate at which updates occur.
    # Leaving this unset will allow for indefinite lapses between updates.
    # min_update_rate: 2.0

    control_modes:
      names: [
        # First in the list gets activated at startup
        "input_publisher_mode",
        "locked_publisher"
      ]

      # Declare types for the modes
      # Publishes input from teleop
      input_publisher_mode:
        display_name: "Input Publisher Control Mode"
        type: "input_publisher_mode/InputPublisherMode"
        active: true

      # Publishes the current locked status
      locked_publisher:
        display_name: "Locked Status Publisher"
        type: "locked_publisher/LockedPublisher"
        active: true

    # Add lock and unlock commands
    commands:
      names:
        - lock
        - unlock
        - log_locked
        - log_unlocked

      lock:
        on_any:
          - "lock/down"
          - "start"
        type: set_button
        name: "locked"
        value: true
      unlock:
        on: "unlock/down"
        type: set_button
        name: "locked"
        value: false
      log_locked:
        on: "locked/down"
        type: log
        message: "Locked"
      log_unlocked:
        on: "locked/up"
        type: log
        message: "Unlocked"

locked_publisher:
  ros__parameters:
    topic: "/locked_status"

input_publisher_mode:
  ros__parameters:
    input_names_topic: "/science/input"

    axis_names:
      # Auger
      - "auger_actuation"
      - "auger_drill_speed"
      # Analysis Arm
      - "analysis_arm_actuation"
      # CBeam
      - "cbeam_actuation"
      # Caches
      - "cache_right_actuation"
      - "cache_right_speed"
      - "cache_left_actuation"
      - "cache_left_speed"
    button_names:
      # Auger
      - "auger_drill"
      - "auger_drill_clockwise"
      - "auger_drill_anticlockwise"
      - "activate_auger_left"
      - "activate_auger_right"
      # Analysis Arm
      - "activate_analysis_arm"
      # CBeam
      - "activate_cbeam"
