# ==========================================================
# Monash Nova Rover
# URC Science – Default Parameter File
# ==========================================================

# Analysis Arm - Nodes for components on the analysis arm

analysis_arm:
  ros__parameters:
    can_bus: "can1"
    active: false
    active_button: "activate_analysis_arm"
    inactive_button_pool: [ "activate_cbeam" ]
    controllers:
      controller:
        actuation_axis: "analysis_arm_actuation"
    hardware:
      actuation:
        can_id: 0x032
        max_effort: 0.3
        reversed: true

#time_of_flight_sensor:
