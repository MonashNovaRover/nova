nir_probe:
  ros__parameters:
    can_bus: "can1"
    controllers:
      controller:
        update_rate: 5
        photodiode_sensors: ["PD1", "PD2"]
        hardware_name: "NIR_Probe"
        command_service: "/science/take_nir_probe_reading"
        data_topic: "/science/nir_probe_data"
    hardware:
      NIR_Probe_take_reading:
        can_id: 0x0E9
      NIR_Sensors:
        can_id: 0x4E2
        unit: "data"
        initial_value: [0,0]


# CBeam - Nodes for components on the CBeam

auger_left:
  ros__parameters:
    can_bus: "can1"
    active: true
    active_button: "activate_auger_left"
    inactive_button_pool: [ "activate_auger_right" ]
    controllers:
      hall_effect_controller:
        topic_name: "/science/auger_left/hall_effect"
    hardware:
      actuation:
        can_id: 0x0D2
        max_effort: 1.0
        reversed: false
      drill:
        can_id: 0x0C2
        max_effort: 0.9
        reversed: false
      hall_sensor:
        can_id: 0x4E4
        can_data_position: 0

auger_right:
  ros__parameters:
    can_bus: "can1"
    active: false
    active_button: "activate_auger_right"
    inactive_button_pool: [ "activate_auger_left" ]
    controllers:
      hall_effect_controller:
        topic_name: "/science/auger_right/hall_effect"
    hardware:
      actuation:
        can_id: 0x0D1
        max_effort: 1.0
        reversed: false
      drill:
        can_id: 0x0C1
        max_effort: 0.9
        reversed: false
      hall_sensor:
        can_id: 0x4E4
        can_data_position: 1

cbeam:
  ros__parameters:
    can_bus: "can1"
    active: true
    active_button: "activate_cbeam"
    inactive_button_pool: [ "activate_analysis_arm" ]
    controllers:
      controller:
        actuation_axis: "cbeam_actuation"
    hardware:
      actuation:
        can_id: 0x041
        max_effort: 1.0
        reversed: false

# Science Belly - Nodes for components in the belly
pumps:
  ros__parameters:
    can_bus: "can1"
    update_rate: 10
    controllers:
      controller:
        max_effort: 0.75
        publish_rate: 5
    hardware:
      cache_to_shot_pump:
        can_id: 0x000 #TODO: update all
      shot_to_inner_pump:
        can_id: 0x000
      shot_to_outer_pump:
        can_id: 0x000
      shot_to_electrochem_pump:
        can_id: 0x000

carousel_inner:
  ros__parameters:
    can_bus: "can1"
    update_rate: 10
    controllers:
      controller:
        initial_position: 0.0
        hardware_name: "carousel"
    hardware:
      carousel:
        zero_cmd_can_id: 0xFFC  # TODO: update
        zero_cmd_can_msg: [0x10]
        zero_rec_can_id: 0xFFD
        zero_rec_can_msg: [0x10]
        zero_service: "/science/carousel_inner/trigger_zero"
        zero_increment_service: "/science/carousel_inner/increment_zero"
      servo:
        can_id: 0x0EA
        function_id: 0x01
      carousel_position_sensor:
        can_id: 0xFFB
        function_id: 0x01
      carousel_load_current_sensor:
        can_id: 0xFFA
        function_id: 0x02
      hall_sensor:
        can_id: 0x4E4
        can_data_position: 2

carousel_outer:
  ros__parameters:
    can_bus: "can1"
    update_rate: 10
    controllers:
      controller:
        initial_position: 0.0
        hardware_name: "carousel"
    hardware:
      carousel:
        zero_cmd_can_id: 0xFFA
        zero_cmd_can_msg: [0x10]
        zero_rec_can_id: 0xFFE
        zero_rec_can_msg: [0x10]
        zero_service: "/science/carousel_outer/trigger_zero"
        zero_increment_service: "/science/carousel_outer/increment_zero"
      servo:
        can_id: 0x0EA
        function_id: 0x02
      carousel_position_sensor:
        can_id: 0xFFD
        function_id: 0x01
      carousel_load_current_sensor:
        can_id: 0xFFF
        function_id: 0x02
      hall_sensor:
        can_id: 0x4E4
        can_data_position: 3

litmus_dipper:
  ros__parameters:
    can_bus: "can1"
    update_rate: 10
    controllers:
      controller:
        hardware_name: "dipper"
        min_angle: 0.0
        max_angle: 180.0 # tune this, should ideally be same as lowered_pos or slightly higher?
        initial_angle: 0.0
        raised_pos: 0.0 # tune this
        lowered_pos: 180.0 # tune this
        twitch_service: "/science/litmus_dipper/twitch"
    hardware:
      dipper:
        can_id: 0x0E0
        angular_limit: 180.0

heaters:
  ros__parameters:
    can_bus: "can1"
    update_rate: 5

spec_leds:
  ros__parameters:
    can_bus: "can1"
    update_rate: 5
    controllers:
      controller:
        led_list: [ "vis_spec_central_led", "vis_spec_nile_red", "vis_spec_camera", "vis_spec_nadh", "litmus_led" ]
    hardware:
      vis_spec_central_led:
        can_id: 0x0FC
        on_command: 0x01
        off_command: 0x00
      vis_spec_nile_red:
        can_id: 0x0F3
        on_command: 0x01
        off_command: 0x00
      vis_spec_camera:
        can_id: 0x0F2
        on_command: 0x01
        off_command: 0x00
      vis_spec_nadh:
        can_id: 0x0FB
        on_command: 0x01
        off_command: 0x00
      litmus_led:
        can_id: 0x0FA
        on_command: 0x01
        off_command: 0x00

# Misc - Nodes for misc components
scimbal_cam:
  ros__parameters:
    can_bus: "can1"
    update_rate: 5
    hardware:
      pan:
        can_id: 0x0E0
        angular_limit: 360.0
      tilt:
        can_id: 0x0E1
        angular_limit: 90.0

cache_left:
  ros__parameters:
    can_bus: "can1"
    update_rate: 5
    controllers:
      controller:
        cache_name: "cache_left"
    hardware:
      actuation:
        can_id: 0xE3

cache_right:
  ros__parameters:
    can_bus: "can1"
    update_rate: 5
    controllers:
      controller:
        cache_name: "cache_right"
    hardware:
      actuation:
        can_id: 0xE2


bme_sensor:
  ros__parameters:
    can_bus: "can1"
    controllers:
      controller:
        update_rate: 5
        sensor_names: ["bme_temperature", "bme_pressure", "bme_humidity"]
        sensor_units: ["temperature", "pressure", "humidity"]
        data_topic: "/science/bme_sensor"
    hardware:
      bme_multisensor:
        can_id: 0x4F5
        hardware_names: ["bme_temperature", "bme_pressure", "bme_humidity"]
        hardware_units: ["temperature", "pressure", "humidity"]
        last_values: [0.0, 0.0, 0.0]
