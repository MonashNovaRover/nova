# gz clock to ros 
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS # BIDIRECTIONAL or ROS_TO_GZ

## BIGLIDE
# joint states 
- ros_topic_name: "/joint_states"
  gz_topic_name: "/world/empty/model/biglide/joint_state"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

# joint1 cmd effort
- ros_topic_name: "/joint1_cmd_effort"
  gz_topic_name: "/model/biglide/joint/A12/cmd_force"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

# joint2 cmd effort
- ros_topic_name: "/joint2_cmd_effort"
  gz_topic_name: "/model/biglide/joint/A21/cmd_force"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

