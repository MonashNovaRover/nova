# Configuration for the Latest XBOX Controller
teleop_drive_joy:
  ros__parameters:
    pivot_drive_controller:
      axis_linear:
        x: 1
      scale_linear:
        x: 0.1
      axis_angular:
        z: 3
      scale_angular:
        z: 1

    strafe_controller:
      axis_linear:
        x: 1
      scale_linear:
        x: 0.1
      axis_angular:
        z: 3
      scale_angular:
        z: 1

    nova_diff_drive_controller:
      axis_linear:
        x: 1
      scale_linear:
        x: 0.1
      axis_angular:
        z: 3
      scale_angular:
        z: 1

    button_unlock: 9
    button_lock: 10
    button_strafe_controller: 6
    button_pivot_drive_controller: 7
    button_nova_diff_drive_controller: 4
    button_autonomous_control: 0
    button_manual_control: 1
    axis_speed_change_coarse: 7
    axis_speed_change_fine: 6
    speed_change_coarse_val: 0.1
    speed_change_fine_val: 0.02
