        button_id_positive: 3
        invert: true

      J4:
        device: "gamepad"
        id: 4
      J5:
        device: "gamepad"
        id: 3
#        button_id_negative: 2
#        button_id_positive: 1
      J6:
        device: "gamepad"
        button_id_negative: 1
        button_id_positive: 2

      speed:
        device: "gamepad"
        id: 5
        invert: true
#      offset:
#        device: "gamepad"
#        id: 4


      twist_x:
        device: "gamepad"
        id: 6
      twist_y:
        device: "gamepad"
        id: 7
      twist_z:
        device: "gamepad"
        button_id_negative: 0
        button_id_positive: 3

      twist_yaw:
        device: "gamepad"
        id: 3
      twist_pitch:
        device: "gamepad"
        id: 4
        invert: true
      twist_roll:
        device: "gamepad"
        button_id_negative: 2
        button_id_positive: 1

    buttons:
      twist_mode:
        device: "gamepad"
        id: 4
      limit_on:
        device: "gamepad"
        id: 4
      limit_off:
        device: "gamepad"
        id: 4
      lock:
        device: "gamepad"
        id: 8
      unlock:
