nova_twistmapper:
  joint_names: {
    type: string_array,
    default_value: [],
    description: "Names of the joints in the ik. Other arrays in this config must be in the same order",
  }

  robot_description: {
    type: string,
    default_value: "",
    description: "The robot_description URDF used to do forward kinematics."
  }

  chained_controller_name: {
    type: string,
    default_value: "nova_ik_controller",
    description: "The name of the chainable controller to capture reference interfaces from. Leave empty to use hardware interfaces."
  }

  # Twistmapper
  twist_stamped_topic: {
    type: string,
    default_value: "/arm_ik_twist_stamped",
    description: "The name of the topic to get teleop twist stamped messages from."
  }
