nova_arm_controller:
  joint_names: {
    type: string_array,
    default_value: [],
    description: "Names of the joints in the arm. Other arrays in this config must be in the same order",
  }
  use_position_control: {
    type: bool,
    default_value: false,
    description: "When true, the arm is driven using position control. Otherwise, it is driven using velocity control."
  }
  joint_position_feedback: {
    type: bool,
    default_value: false, # for the arm I dunno if we will ever not have this, maybe this option should be removed
    description: "Is there position feedback from joint hardware.",
  }
  cmd_timeout: {
    type: double,
    default_value: 0.5, # seconds
    description: "Timeout in seconds, after which input command on ``TODO`` topic is considered staled.",
  }
  publish_limited_velocity: {
    type: bool,
    default_value: false,
    description: "Publish limited velocity value.",
  }
  publish_rate: {
    type: double,
    default_value: 50.0, # Hz
    description: "Publishing rate (Hz) of feedback messages",
  }
  joint_limits: # yes this is long but this is how get_joint_limits() expects it
    J1:
      has_position_limits: {
        type: bool,
        default_value: true,
      }
      max_position: {
        type: double,
        default_value: 0.5,
      }
      min_position: {
        type: double,
        default_value: 0,
      }
      has_velocity_limits: {
        type: bool,
        default_value: true,
      }
      max_velocity: {
        type: double,
        default_value: 0,
      }
      has_acceleration_limits: {
        type: bool,
        default_value: true,
      }
      max_acceleration: {
        type: double,
        default_value: 0.2,
      }
      has_deceleration_limits: {
        type: bool,
        default_value: true,
      }
      max_deceleration: {
        type: double,
        default_value: 0.2,
      }
      has_jerk_limits: {
        type: bool,
        default_value: true,
      }
      max_jerk: {
        type: double,
        default_value: 0.1,
      }
