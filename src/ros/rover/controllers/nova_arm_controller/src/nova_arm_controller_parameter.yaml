nova_arm_controller:
  joint_names: {
    type: string_array,
    default_value: [],
    description: "Names of the joints in the arm. Other arrays in this config must be in the same order",
  }
  use_position_control: {
    type: bool,
    default_value: false,
    description: "When true, the arm is driven using position control. Otherwise, it is driven using velocity control."
  }
  cmd_timeout: {
    type: double,
    default_value: 0.5, # seconds
    description: "Timeout in seconds, after which input command on ``TODO`` topic is considered staled.",
  }
  publish_rate: {
    type: double,
    default_value: 50.0, # Hz
    description: "Publishing rate (Hz) of feedback messages",
  }
  joint_limits: # yes this is long but this is how get_joint_limits() expects it. units are radians and seconds
    J1:
      has_position_limits: {
        type: bool,
        default_value: true,
      }
      max_position: {
        type: double,
        default_value: 1.57,
      }
      min_position: {
        type: double,
        default_value: -1.57,
      }
      has_velocity_limits: {
        type: bool,
        default_value: true,
      }
      max_velocity: {
        type: double,
        default_value: 0.4,
      }
      has_acceleration_limits: {
        type: bool,
        default_value: true,
      }
      max_acceleration: {
        type: double,
        default_value: 0.3,
      }
    J2:
      has_position_limits: {
        type: bool,
        default_value: true,
      }
      max_position: {
        type: double,
        default_value: 1,
      }
      min_position: {
        type: double,
        default_value: -1.57,
      }
      has_velocity_limits: {
        type: bool,
        default_value: true,
      }
      max_velocity: {
        type: double,
        default_value: 0.4,
      }
      has_acceleration_limits: {
        type: bool,
        default_value: true,
      }
      max_acceleration: {
        type: double,
        default_value: 0.3,
      }
