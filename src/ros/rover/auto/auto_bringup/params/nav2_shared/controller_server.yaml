controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 30.0
    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.001
    failure_tolerance: -1.0 # The maximum duration in seconds the called controller plugin can fail (i.e. the computeVelocityCommands function of the plugin
                            # throwing an exception) before the nav2_msgs::action::FollowPath action fails. Setting it to the special value of -1.0 makes it
                            # infinite, 0 to disable, and any positive value for the appropriate timeout.
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["RotationShimMPPI"]
    use_realtime_priority: True
    enable_stamped_cmd_vel: True
    odom_topic: /odometry/filtered
    progress_checker:
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.3 # Minimum amount a robot must move to be progressing to goal (m).
      required_movement_angle: 0.5  # Minimum amount a robot must rotate to be progressing to goal (rad).
      movement_time_allowance: 60.0 # Maximum amount of time (sec) a robot has to move the minimum radius or the minimum angle.
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.5
      yaw_goal_tolerance: 6.28 # 360 degrees in radians.
      stateful: false # Whether to check for XY position tolerance after rotating to goal orientation in case of minor localization changes.
    
    # Rotation Shim Controller https://github.com/ros-navigation/navigation2/tree/jazzy/nav2_rotation_shim_controller
    # MPPI https://docs.nav2.org/configuration/packages/configuring-mppic.html    
    RotationShimMPPI:
      # plugin: "nav2_mppi_controller::MPPIController"
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_mppi_controller::MPPIController"
      angular_dist_threshold: 1.4835          # ~85 degrees
      angular_disengage_threshold: 0.4363     # ~25 degrees
      forward_sampling_distance: 0.5
      rotate_to_heading_angular_vel: 0.5236   # ~30 degrees/s
      max_angular_accel: 0.5236
      simulate_ahead_time: 1.0
      rotate_to_goal_heading: false
      rotate_to_heading_once: false
      closed_loop: false
      
      # MPPI params
      # Angular and velocity limits are more loosely set here to allow for the planning of
      # more aggressive trajectories. The velocity smoother sets stricter limits to ensure
      # the planned trajectories are still accurately followed.
      #
      # Higher vx_std and wz_std values allow for more aggressive trajectories, but can lead
      # to more oscillation and more variable paths. Tuning these is a balance between allowing
      # for aggressive obstacle avoidance and maintaining smooth and accurate control.
      #
      # Obstacle avoidance behaviour is closely linked to the inflation layer and the Cost Critic.
      # Read https://docs.nav2.org/configuration/packages/configuring-mppic.html#general-words-of-wisdom.
      # The inflation radius guides the controller to plan trajectories around and between obstacles.
      # The inflation cost scaling factor determines how close the controller is willing to plan around
      # obstacles. Higher values allow the controller to plan closer, whereas lower values will cause
      # the controller to plan further around obstacles.
      #
      # prediction horizon (m) = v_max * time_steps * model_dt
      time_steps: 40
      model_dt: 0.1
      batch_size: 2000
      vx_std: 0.2   # higher sampled velocities are likely to give higher speed trajectories (capped at vx_max)
      vy_std: 0.2   # only used in Omni motion model
      wz_std: 0.6   # similar to vx_std, higher values allow trajectories with higher rotation
      vx_max: 0.3   # max linear velocity, ~3.6 km/h
      vx_min: -0.21 # vx_max * 0.7
      vy_max: 0.5   # only used in Omni motion model
      wz_max: 0.78  # max angular velocity (rad/s), ~90 degrees/s
      ax_max: 4.0   # max linear acceleration. going lower gives preference to rotational trajectories
      ax_min: -4.0 
      ay_max: 3.0   # only used in Omni motion model
      ay_min: -3.0  # only used in Omni motion model
      az_max: 4.0   # max angular acceleration
      iteration_count: 1
      transform_tolerance: 0.1
      temperature: 0.3
      motion_model: "DiffDrive" # if holonomic drive works, can try "Omni"
      prune_distance: 1.7       # slightly longer than prediction horizon
      visualize: true
      TrajectoryVisualizer:
        trajectory_step: 10
        time_step: 6
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic",
                "PathAlignCritic", "PathFollowCritic", "PathAngleCritic",
                "PreferForwardCritic", "VelocityDeadbandCritic", "TwirlingCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 15.0
        threshold_to_consider: 1.2 # prediction horizon
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      # The Cost Critic incentivizes navigating away from obstacles and critical collisions
      # Setting the weight too high will cause the robot to stop upon reaching an obstacle
      # instead of trying to navigate around it.
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0 
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 15.0  
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 6 # prediction horizon / path_resolution / 3.0
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 6
        threshold_to_consider: 1.2 # prediction horizon
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 2         
      PreferForwardCritic:
        enabled: false
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      VelocityDeadbandCritic:
        enabled: false     
        cost_power: 1
        cost_weight: 5.0
        deadband_velocities: [0.05, 0.05, 0.05]
      TwirlingCritic:
        enabled: false
        twirling_cost_power: 1
        twirling_cost_weight: 10.0
    
    # RPP
    # FollowPath:
    #   plugin: # https://docs.nav2.org/configuration/packages/configuring-regulated-pp.html
    #     "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
    #   desired_linear_vel: 
    #     2.0
    #   lookahead_dist: # if use_velocity_scaled_lookahead_dist = false
    #     5.0
    #   min_lookahead_dist: # if use_velocity_scaled_lookahead_dist = true
    #     0.3
    #   max_lookahead_dist: # if use_velocity_scaled_lookahead_dist = true
    #     5.0
    #   lookahead_time: # if use_velocity_scaled_lookahead_dist = true
    #     1.5
    #   rotate_to_heading_angular_vel: # if use_rotate_to_heading = true
    #     0.7
    #   transform_tolerance: 
    #     0.1
    #   use_velocity_scaled_lookahead_dist: 
    #     false
    #   min_approach_linear_velocity: 
    #     0.5
    #   approach_velocity_scaling_dist: 
    #     10.0
    #   use_collision_detection: 
    #     false
    #   max_allowed_time_to_collision_up_to_carrot: # if use_collision_detection = true
    #     10.0
    #   use_regulated_linear_velocity_scaling: 
    #     true
    #   use_cost_regulated_linear_velocity_scaling: 
    #     false
    #   regulated_linear_scaling_min_radius: # if use_regulated_linear_velocity_scaling = true
    #     0.5
    #   regulated_linear_scaling_min_speed: 
    #     0.5
    #   use_fixed_curvature_lookahead: 
    #     true
    #   curvature_lookahead_dist: 
    #     1.0
    #   use_rotate_to_heading: 
    #     false 
    #   allow_reversing: 
    #     false
    #   rotate_to_heading_min_angle: # if use_rotate_to_heading = true
    #     0.785398
    #   max_angular_accel: # if use_rotate_to_heading = true
    #     0.5
    #   use_cancel_deceleration: 
