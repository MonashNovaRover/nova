velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 30.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    # Angular velocity and acceleration limits are more strict than in MPPI.
    # This is to allow MPPI to plan more aggressive trajectories while still
    # ensuring the controller can follow them accurately.
    max_velocity: [0.3, 0.0, 0.52]
    min_velocity: [-0.21, 0.0, -0.52]
    max_accel: [4.0, 0.0, 4.0]
    max_decel: [-4.0, 0.0, -4.0]
    odom_topic: /odometry/filtered
    odom_duration: 0.1
    # deadband_velocity: [0.01, 0.01, 0.01]
    velocity_timeout: 1.0
    enable_stamped_cmd_vel: True