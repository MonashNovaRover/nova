velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 30.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [1.0, 0.0, 1.57]
    min_velocity: [-0.7, 0.0, -1.57]
    max_accel: [4.0, 0.0, 8.0]
    max_decel: [-4.0, 0.0, -8.0]
    odom_topic: /odometry/filtered
    odom_duration: 0.1
    # deadband_velocity: [0.01, 0.01, 0.01]
    velocity_timeout: 1.0
    enable_stamped_cmd_vel: True