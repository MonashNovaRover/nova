# Livox LaserScans
- ros_topic_name: "/livox/lidar/scan"
  gz_topic_name: "/livox/lidar"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

# Livox PointClouds
- ros_topic_name: "/livox/lidar_sim"
  gz_topic_name: "/livox/lidar/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS

# Livox IMU
- ros_topic_name: "/livox/imu"
  gz_topic_name: "/livox/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

# GPS
- ros_topic_name: "/gps_rover/fix"
  gz_topic_name: "/gps"
  ros_type_name: "sensor_msgs/msg/NavSatFix"
  gz_type_name: "gz.msgs.NavSat"
  direction: GZ_TO_ROS

# GPS heading IMU (used by navsat_transform)
- ros_topic_name: "/gps_rover/heading_imu_raw"
  gz_topic_name: "/gps/heading_imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

# Joint states
- ros_topic_name: "/joint_states"
  gz_topic_name: "/joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS
