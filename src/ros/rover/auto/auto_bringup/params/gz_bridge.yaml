# Clock
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS # BIDIRECTIONAL or ROS_TO_GZ

# RealSense D415 color image
- ros_topic_name: "/d415/color/image_raw"
  gz_topic_name: "/d415/color"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

# RealSense D415 color camera info ( Intrinsics Identical to DepthImages )
- ros_topic_name: "/d415/color/camera_info"
  gz_topic_name: "/d415/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

