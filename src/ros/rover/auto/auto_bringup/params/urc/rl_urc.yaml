navsat_transform:
  ros__parameters:
    frequency: 30.0
    delay: 3.0
    magnetic_declination_radians: 0.0
    yaw_offset: 0.0 # Set to yaw used for ros_gz_sim create executable to work in sim. Set to 0.0 for real life.
    zero_altitude: true
    broadcast_utm_transform: false
    publish_filtered_gps: true
    use_odometry_yaw: false
    wait_for_datum: false
    # datum: [38.41526728780185, -110.788293144296, 0.0] # wait_for_datum must be true to be applied, pre-set datum if needed, [lat, lon, yaw]
