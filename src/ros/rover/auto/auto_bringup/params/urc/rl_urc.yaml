    odom0_config: [true,  true,  true, #https://docs.ros.org/en/api/robot_localization/html/integrating_gps.html#configuring-robot-localization
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false

    # Wheel Odom
