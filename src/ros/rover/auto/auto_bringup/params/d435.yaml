d435:
  ros__parameters:
    camera_name: d435
    camera_namespace: ""
    enable_color: true
    enable_depth: false
    enable_infra: false
    enable_infra1: true
    enable_infra2: false
    depth_module.emitter_enabled: 0
    publish_tf: true

    # run rs_enumerate_devices for available configurations
    rgb_camera.color_profile: 720x480x15
    depth_module.infra_profile: 1280x720x30