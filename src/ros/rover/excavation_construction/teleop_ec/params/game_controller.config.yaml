# game pad input source

teleop_ec:
  ros__parameters:
    input_sources:
      names: ["game_controller_source"]

      game_controller_source:
        type: "teleop_modular_joy/JoyInputSource"



game_controller_source:
  ros__parameters:
    topic: "/ec/joy"

    button_definitions: [
      "A",
      "B",
      "X",
      "Y",
      "BACK",
      "GUIDE",
      "START",
      "LEFTSTICK",
      "RIGHTSTICK",
      "LEFTSHOULDER",
      "RIGHTSHOULDER",
      "DPAD_UP",
      "DPAD_DOWN",
      "DPAD_LEFT",
      "DPAD_RIGHT",
      "MISC1",
      "PADDLE1",
      "PADDLE2",
      "PADDLE3",
      "PADDLE4",
      "TOUCHPAD"
    ]
    axis_definitions: [
      "LEFTX",
      "LEFTY",
      "RIGHTX",
      "RIGHTY",
      "TRIGGERLEFT",
      "TRIGGERRIGHT"
    ]

    remap:
      axes:
        arm_actuation:
          from: "LEFTY"

        scoop_actuation:
          from: "RIGHTY"

        claw_actuation:
          from_buttons:
            positive: "RIGHTSHOULDER"
            negative: "LEFTSHOULDER"

        scraper_speed:
          from: "TRIGGERRIGHT"
          invert: true

        forklift_speed:
          from: "TRIGGERLEFT"
          invert: true

        forklift_actuation:
          from_buttons:
            positive: "Y"
            negative: "A"

      buttons:
        lock:
          from: "BACK"

        unlock:
          from: "START"

        # support scraper speed changes using dpad
        # NOT WORKING (using right trigger as speed axis instead)
#        increase_scraper_speed:
#          from: "DPAD_UP"
#        decrease_scraper_speed:
#          from: "DPAD_DOWN"