nova_path_planner:
  joint_names: {
    type: string_array,
    default_value: [],
    description: "Names of the joints in the ik. Other arrays in this config must be in the same order.",
  }
  chained_controller_name: {
    type: string,
    default_value: "nova_ik_controller",
    description: "The name of the chainable controller to capture reference interfaces from. Leave empty to use hardware
    interfaces."
  }

  action_name: {
    type: string,
    default_value: "/arm/plan_path",
    description: "The name of the action to accept path planning requests from."
  }

  base_link_name: {
    type: string,
    default_value: "arm_kinematics_origin",
    description: "The name of the frame/link to use as the origin/base frame for kinematics."
  }
  ee_link_name: {
    type: string,
    default_value: "endeffector_kinematics",
    description: "The name of the frame/link to use as the endeffector/tip frame for kinematics."
  }
  kinematics_output_target_frame: {
    type: string,
    default_value: "arm_path_planner_target",
    description: "Reserved target frame name for path-planner debug output."
  }

  self_intersection_max_step_size: {
    type: double,
    default_value: 0.05,
    description: "The max step size, in radians, for any joint in self intersection checks for large movements. This
    helps to prevent unsafe maneuvers from being executed where a self-intersecting state is 'jumped over' by the
    kinematics solver, by computing in-between steps between poses of at most self_intersection_max_step_size radians
    per joint.",
  }

# Shared arm_kinematics configuration is read separately:
#   - kinematics.forward_kinematics_plugin
#   - kinematics.inverse_kinematics_plugin
#   - kinematics.collision_plugin
#   - collision.*
