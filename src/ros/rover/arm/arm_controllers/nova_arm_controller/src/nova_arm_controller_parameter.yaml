nova_arm_controller:
  joint_names: {
    type: string_array,
    default_value: [],
    description: "Names of the joints (actuators) in the arm. Other arrays in this config must be in the same order",
  }
  fake_joint_names: {
    type: string_array,
    default_value: [],
    description: "Names of the virtual joints in the arm that you need limits for",
  }
  fake_joints:
    __map_fake_joint_names:
      offset: {
        type: double,
        default_value: 0.0,
        description: "Offset for this fake joint"
      }
      multipliers: {
        type: double_array,
        default_value: [],
        description: "How much one revolution of each real joint moves this virtual joint. same order as joint_names"
      }
  topic: {
    type: string,
    default_value: "/arm/forward_command",
    description: "The name of the topic to get command messages from."
  }
  position_feedback: {
    type: bool,
    default_value: true,
    description: "Require position state interfaces."
  }
  velocity_feedback: {
    type: bool,
    default_value: true,
    description: "Require velocity state interfaces."
  }
  use_position_control: {
    type: bool,
    default_value: false,
    description: "When true, the arm is driven using position control. Otherwise, it is driven using velocity control."
  }
  cmd_timeout: {
    type: double,
    default_value: 0.5, # seconds
    description: "Timeout in seconds, after which input command on ``TODO`` topic is considered staled.",
  }
  publish_rate: {
    type: double,
    default_value: 50.0, # Hz
    description: "Publishing rate (Hz) of feedback messages",
  }
  use_limits: {
    type: bool,
    default_value: true,
    description: "True if the arm should apply position, velocity and acceleration limits",
  }
  use_collision_limits: {
    type: bool,
    default_value: true,
    description: "True if the arm should perform self intersection checks",
  }
