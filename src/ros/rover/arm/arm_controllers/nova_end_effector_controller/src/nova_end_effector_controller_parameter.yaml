nova_end_effector_controller:
  joint_names: {
    type: string_array,
    default_value: [],
    description: "Names of the joints in the arm. Other arrays in this config must be in the same order",
  }
  topic: {
    type: string,
    default_value: "/arm/forward_command",
    description: "The name of the topic to get command messages from."
  }
  use_position_control: {
    type: bool,
    default_value: false,
    description: "When true, the arm is driven using position control. Otherwise, it is driven using velocity control."
  }
  cmd_timeout: {
    type: double,
    default_value: 0.5, # seconds
    description: "Timeout in seconds, after which input command on ``TODO`` topic is considered staled.",
  }
  publish_rate: {
    type: double,
    default_value: 50.0, # Hz
    description: "Publishing rate (Hz) of feedback messages",
  }
  use_limits: {
    type: bool,
    default_value: true,
    description: "True if the arm should apply position, velocity and acceleration limits",
  }
  joint_limits: # yes this is long but this is how get_joint_limits() expects it. units are radians and seconds
    actuator_head:
        has_position_limits: {
          type: bool,
          default_value: false,
        }
        max_position: {
          type: double,
          default_value: 1.57079632679,
        }
        min_position: {
          type: double,
          default_value: -1.57079632679,
        }
        has_velocity_limits: {
          type: bool,
          default_value: true,
        }
        max_velocity: {
          type: double,
          default_value: 0.364467013889,
        }
        has_acceleration_limits: {
          type: bool,
          default_value: false,
        }
        max_acceleration: {
          type: double,
          default_value: 15.7079632679,
        }
