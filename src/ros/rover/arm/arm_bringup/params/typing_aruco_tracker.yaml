/aruco_tracker:
  ros__parameters:
    aruco:
      cornerRefinementMethod: 2
    cam_base_topic: /arm/periscope
    image_is_rectified: false
    marker_dict: 4X4_50
    marker_size: 0.02 # marker_size refers to the sidelength of the marker (in m), which for URC 2026, will be 20 mm.
    output_frame: image_frame # Frame which AR marker position is published relative to.