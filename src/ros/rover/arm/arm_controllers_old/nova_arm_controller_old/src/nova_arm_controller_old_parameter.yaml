nova_arm_controller_old:
  joint_names: {
    type: string_array,
    default_value: [],
    description: "Names of the joints in the arm. Other arrays in this config must be in the same order",
  }
  do_4bar: {
    type: bool,
    default_value: false,
    description: "make a fake joint for limiting the 4 bar linkage angle (j2 - j3)"
  }
  j2_minus_j3:
    j2_idx: { # this is a really bad way of doing this 
      type: int,
      default_value: -1,
      description: "index of j2 in joint_names"
    }
    j3_idx: {
      type: int,
      default_value: -1,
      description: "index of j3 in joint_names"
    }
    max_position: {
      type: double,
      default_value: 0.0
    }
    min_position: {
      type: double,
      default_value: 0.0
    }
  topic: {
    type: string,
    default_value: "/arm/forward_command",
    description: "The name of the topic to get command messages from."
  }
  position_feedback: {
    type: bool,
    default_value: true,
    description: "Require position state interfaces."
  }
  velocity_feedback: {
    type: bool,
    default_value: true,
    description: "Require velocity state interfaces."
  }
  use_position_control: {
    type: bool,
    default_value: false,
    description: "When true, the arm is driven using position control. Otherwise, it is driven using velocity control."
  }
  cmd_timeout: {
    type: double,
    default_value: 0.5, # seconds
    description: "Timeout in seconds, after which input command on the topic is considered staled.",
  }
  publish_rate: {
    type: double,
    default_value: 50.0, # Hz
    description: "Publishing rate (Hz) of feedback messages",
  }
  use_limits: {
    type: bool,
    default_value: true,
    description: "True if the arm should apply position, velocity and acceleration limits",
  }
  use_collision_limits: {
    type: bool,
    default_value: true,
    description: "True if the arm should perform self intersection checks",
  }
