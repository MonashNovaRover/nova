# teleop.yaml
teleop_node:
  ros__parameters:
    # The maximum rate at which updates should occur, and hence the max rate at which commands are sent.
    # Leaving this unset makes the max update rate unlimited.
    # update_rate: 50.0

    # The minimum rate at which updates occur.
    # Leaving this unset will allow for indefinite lapses between updates.
    min_update_rate: 2.0

    control_modes:
      names: [
        "joint_space_mode"
        "ik_mode"
      ]

      # Then declare its type!
      joint_space_mode:
        type: "joint_space_control_mode/JointSpaceControlMode"
      ik_mode:
        type: "teleop_modular_twist/TwistControlMode"

    input_sources:
      names: [
        "joy_input_source"
      ]

      # Then declare its type!
      joy_input_source:
        type: "teleop_modular_joy/JoyInputSource"


joint_space_mode:
  ros__parameters:
    topic: "/arm_fk_velocity_target"
    joints:
      1:
        name: "j1"
        input_name: "j1"
        scale: 0.36
      2:
        name: "j2"
        input_name: "j2"
        scale: 0.36
      3:
        name: "j3"
        input_name: "j3"
        scale: 0.36
      4:
        name: "j4"
        input_name: "j4"
        scale: 0.36
      5:
        name: "j5"
        input_name: "j5"
        scale: 0.36
      6:
        name: "j6"
        input_name: "j6"
        scale: 0.36


# TODO: ik_mode


joy_input_source:
  ros__parameters:
    topic: "/joy"
    # These are the default mappings for a game_controller_node.
    # https://docs.ros.org/en/ros2_packages/rolling/api/joy/index.html
    # If you use joy_node, you'll need to figure out what the mapping is yourself.
    # So, run joy, `ros2 topic echo /joy`, and mess around with your controller to figure out what it is for you.
    button_definitions: [
      "A",
      "B",
      "X",
      "Y",
      "BACK",
      "GUIDE",
      "START",
      "LEFTSTICK",
      "RIGHTSTICK",
      "LEFTSHOULDER",
      "RIGHTSHOULDER",
      "DPAD_UP",
      "DPAD_DOWN",
      "DPAD_LEFT",
      "DPAD_RIGHT",
      "MISC1",
      "PADDLE1",
      "PADDLE2",
      "PADDLE3",
      "PADDLE4",
      "TOUCHPAD"
    ]
    axis_definitions: [
      "LEFTX",
      "LEFTY",
      "RIGHTX",
      "RIGHTY",
      "TRIGGERLEFT",
      "TRIGGERRIGHT"
    ]

