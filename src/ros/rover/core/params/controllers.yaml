controller_manager:
  ros__parameters:
    update_rate: 20 
    use_sim_time: false

    wheel_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

    pivot_position_controller:
      type: position_controllers/JointGroupPositionController

    pivot_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    pivot_drive_controller:
      type: pivot_drive_controller/PivotDriveController

    strafe_controller:
      type: strafe_controller/StrafeController

    nova_diff_drive_controller:
      type: nova_diff_drive_controller/NovaDiffDriveController

    joint_broad:
      type: joint_state_broadcaster/JointStateBroadcaster

wheel_velocity_controller:
  ros__parameters:
    joints:
      - flw
      - blw
      - brw
      - frw

pivot_position_controller:
  ros__parameters:
    joints:
      - flp
      - blp
      - brp
      - frp

joint_broad:
  ros__parameters:
    interfaces:
       ["position",
      "velocity"]

    joints:
      ["blp",
      "brp",
      "flp",
      "frp",
      "blw",
      "brw",
      "flw",
      "frw"]

    use_local_topics: false
    
pivot_drive_controller:
  ros__parameters:
    left_drive_names: ["flw", "blw"]
    right_drive_names: ["frw", "brw"]
    left_pivot_names: ["flp", "blp"]
    right_pivot_names: ["frp", "brp"]
    enable_twist_cmd: true
    open_loop: false
    use_unstamped_msg: true
    has_velocity_limits: true
    max_velocity: 0.67
    min_velocity: -0.67

strafe_controller:
  ros__parameters:
    left_drive_names: ["flw", "blw"]
    right_drive_names: ["frw", "brw"]
    left_pivot_names: ["flp", "blp"]
    right_pivot_names: ["frp", "brp"]
    enable_twist_cmd: false
    open_loop: true
    use_unstamped_msg: false
    max_acceleration: 5.0

nova_diff_drive_controller:
  ros__parameters:
    left_drive_names: ["flw", "blw"]
    right_drive_names: ["frw", "brw"]
    left_pivot_names: ["flp", "blp"]
    right_pivot_names: ["frp", "brp"]
    wheels_per_side: 2
    steering_track: 0.7
    wheel_base: 0.84
    wheel_radius: 0.125
    enable_twist_cmd: false
    use_unstamped_msg: false
    linear:
      x:
        max_acceleration: 5.0
