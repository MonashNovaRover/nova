controller_manager:
  ros__parameters:
    update_rate: 10 
    use_sim_time: false

    wheel_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

    pivot_position_controller:
      type: position_controllers/JointGroupPositionController

    pivot_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    pivot_drive_controller:
      type: pivot_drive_controller/PivotDriveController

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

    joint_broad:
      type: joint_state_broadcaster/JointStateBroadcaster

wheel_velocity_controller:
  ros__parameters:
    joints:
      - flw

pivot_position_controller:
  ros__parameters:
    joints:
      - flp


joint_broad:
  ros__parameters:
    joints:
      - flp
      - frp
      - blp
      - brp
      - flw
      - frw
      - blw
      - brw
    use_local_topics: false
    
pivot_drive_controller:
  ros__parameters:
    left_drive_names: ["flw", "blw"]
    right_drive_names: ["frw", "brw"]
    left_pivot_names: ["flp", "blp"]
    right_pivot_names: ["frp", "brp"]

diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["flw", "blw"]
    right_wheel_names: ["frw", "brw"]
    position_feedback: false
    
    
  
