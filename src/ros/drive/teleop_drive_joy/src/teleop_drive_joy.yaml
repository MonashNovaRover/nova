# This is only the schema for Node Parameters
# This YAML will be converted to teleop_drive_joy_parameters.hpp upon build
# Look here for docs about this YAML : https://github.com/PickNikRobotics/generate_parameter_library
teleop_drive_joy:
  teleop_frequency:
    type: int
    default_value: 20
    description: "Frequency (in Hz) at which teleop publishes commands"

  input_topic:
    type: string
    default_value: "/drive/joy"
    description: "Input Topic for Joy Messages"
  output_topic:
    type: string
    default_value: "/cmd_vel"
    description: "Output Topic for Twist Commands"
  drive_info_topic:
    type: string
    default_value: "/drive/drive_info"
    description: "Output topic for drive teleop telemetry"
  joint_states_topic:
    type: string
    default_value: "/drive/joint_states"
    description: "Input topic for wheel/pivot states"
  joy_feedback_topic:
    type: string
    default_value: "/drive/joy/set_feedback"
    description: "Output topic for game pad feedback (e.g. rumble)"
  blcmd_log_topic:
    type: string
    default_value: "/drive/blcmd_log"
    description: "Topic where log messages related to drive are published (e.g. blcmd errors)"

  autolock_enable:
    type: bool
    default_value: true
    description: "Enable automatic locking of controls if there are persistent blcmd errors"
  # meeting ANY autolock threshold will trigger autolock
  autolock_threshold_error_count:
    type: int
    default_value: 0
    description: "Number of (blcmd) errors received (since last autolock) required to trigger autolock (0 to disable)"
  autolock_threshold_error_duration:
    type: int
    default_value: 2250
    description: "Minimum duration (in milliseconds) that (blcmd) errors must remain continuously active for to trigger autolock (0 to disable)"
  autolock_error_active_duration:
    type: int
    default_value: 500
    description: "Duration (in milliseconds) that (blcmd) errors remain 'active' for after receiving it"
  autolock_override:
    type: bool
    default_value: false
    description: "Toggleable override for autolock (set via service call or command)"

  lock_on_gamepad_disconnected:
    type: bool
    default_value: true
    description: "Enable gamepad locking when it is disconnected from the laptop"
  gamepad_connection_timeout:
    type: int
    default_value: 2000
    description: "Gamepad is considered disconnected after this many milliseconds since receiving the last joy message"

  rumble_enable:
    type: bool
    default_value: true
    description: "Enable controller rumbling if wheel effort is sufficiently high"
  rumble_range:
    type: double_array
    default_value: [0.4, 0.8]
    description: >
      Game pad rumble intensity increases proportionally to increases in wheel effort within rumble range. 
      If effort is less than rumble range, game pad will not rumble. 
      If effort is greater than rumble range, game pad will have maximum rumble.
      Both rumble intensity and wheel effort can vary from 0 to 1.
  rumble_joints:
    type: string_array
    default_value: ["frw", "flw", "brw", "blw"]
    description: "Joint names used to derive wheel effort from joint states for rumble_range"
  rumble_delay:
    type: int
    default_value: 0
    description: "Duration in milliseconds before controller actually starts rumbling"
  
  # Deadzone already exists as an input parameter to the joy node (teleop.launch.py)

  max_input_threshold:
    type: double
    default_value: 0.97
    description: "Values above this threshold will be considered as maximum input (1.0)."

  button_debounce_time:
    type: int
    default_value: 250
    description: "Debounce Time for Joy Messages in Milliseconds"

  initial_speed:
    type: double
    default_value: 0.1
    description: "Initial Speed of the Rover when Teleop is started"

  controllers:
    type: string_array
    default_value:
      [
        "pivot_drive_controller",
        "ackermann_steering_controller",
        "strafe_drive_controller",
        "diff_drive_controller",
      ]
    description: "List Of Controllers that can be used with teleop"
    read_only: true
  
  __map_controllers:
    scale_linear:
      type: double
      default_value: 1.0
      description: "A scale parameter applied on linear velocity"
    scale_angular:
      type: double
      default_value: 1.0
      description: "A scale parameter applied on angular velocity"
    limit_linear:
      type: double
      default_value: 1.0
      description: "A limit parameter applied on linear velocity"
    limit_angular:
      type: double
      default_value: 1.0
      description: "A limit parameter applied on angular velocity"
  
  axis_linear_x:
    type: int
    default_value: 1
    description: > 
      The joy axis corresponding to the Twist axis controlling linear velocity.
      Usually mapped to the left stick vertical axis.
  axis_linear_y:
    type: int
    default_value: 0
    description: >
      The joy axis corresponding to the Twist axis controlling lateral velocity.
      Usually mapped to the left stick horizontal axis.
  axis_linear_z:
    type: int
    default_value: 3
    description: >
      The joy axis corresponding to the Twist axis controlling vertical velocity.
      Usually mapped to the right stick vertical axis.
      This is currently not used in any controllers, however it is used to retrieve
      the right stick vertical axis value.
  axis_angular_z:
    type: int
    default_value: 2
    description: >
      The joy axis corresponding to the Twist axis controlling angular velocity.
      Usually mapped to the left stick horizontal axis.

  button_unlock:
    type: int
    default_value: 6
    description: "Unlock Gamepad"
  button_lock:
    type: int
    default_value: 4
    description: "Lock Gamepad"
  button_autonomous_mode:
    type: int
    default_value: 9
    description: "Switch to Autonomous Mode"
  button_manual_mode:
    type: int
    default_value: 10
    description: "Switch to Manual Mode"
  button_strafe_drive_controller:
    type: int
    default_value: 2
    description: "Switch to Strafe Mode"
  button_ackermann_drive_controller:
    type: int
    default_value: 1
    description: "Switch to Ackermann Mode"
  button_pivot_drive_controller:
    type: int
    default_value: 0
    description: "Switch to Pivot Mode"
  button_diff_drive_controller:
    type: int
    default_value: 3
    description: "Switch to Tank Mode"
  button_speed_decrease_fine:
    type: int
    default_value: 13
    description: "Decrease speed on a fine scale"
  button_speed_increase_fine:
    type: int
    default_value: 14
    description: "Increase speed on a fine scale"
  button_speed_decrease_coarse:
    type: int
    default_value: 12
    description: "Decrease speed on a coarse scale"
  button_speed_increase_coarse:
    type: int
    default_value: 11
    description: "Increase speed on a coarse scale"

  axis_override_autolock:
    type: int
    default_value: 4
    description: "Prevents autolock from activating while held down"
  axis_handbrake:
    type: int
    default_value: 5
    description: "Decrease linear velocity by a fixed proportion"
  handbrake_speed_multiplier:
    type: double
    default_value: 0.6
    description: "Multiplier that applies to linear velocity when handbrake is pressed"
  trigger_pressed_threshold:
    type: double
    default_value: 0.1
    description: "Proportion that right/left trigger must move beyond to be interpreted as pressed"

  speed_change_coarse_val:
    type: double
    default_value: 0.1
    description: "Value to change speed when the speed_change_coarse is invoked"
  speed_change_fine_val:
    type: double
    default_value: 0.025
    description: "Value to change speed when the speed_change_fine is invoked"

  # 1.0 = 100% max linear velocity, 0.5 = 50% max linear velocity, etc.
  # Max linear velocity is defined by the controller e.g. in pivot_drive_controller.yaml
  speed_limit_max:
    type: double
    default_value: 1.0
    description: "Factor to limit the maximum speed of the Rover"
  speed_limit_min:
    type: double
    default_value: 0.05
    description: "Factor to limit the minimum speed of the Rover"
