camera_streamer:
  ros__parameters:  
    serial_pipelines:
      # Development cameras
      anthony-cam:
        pipeline_type: h264passthrough
        width: 1920
        height: 1080
        framerate: 30

      # Mast
      mast_backward:
        meta : Mast - Backwards
      mast_arm_stow:
        meta: Mast - Arm Stow
      mast_belly:
        meta: Mast - Down
      mast_forward:
        meta: Mast - Forwards

      # Science
      science_microscope:
        meta: Science - Microscope
        pipeline_type: vp9software
        mime: video/x-raw
        width: 640
        height: 480
        framerate: 25
        cpu_usage: 5
        bitrate: 1024
        gop: 3
      science_gantry:
        meta: Science - Gantry
      science_spectrometer_top:
        meta: Science - Spectrometer (Top)
      science_spectrometer_side:
        meta: Science - Spectrometer (Side)
      science_backward:
        meta: Science - Butt
      science_shotglass:
        meta: Science - Shotglass
      science_rock_flipper:
        meta: Science - Rock flipper
      #science_spectroscope:
      #  autostart: false

      # Arm
      arm_wrist:
        meta: Arm - Wrist 
      arm_end_periscope:
        meta: Arm - Periscope
      arm_end_top:
        meta: Arm - Top
      arm_end_finger:
        meta: Arm - Finger
      arm_end_side:
        meta: Arm - Side

    profiles:
      unknown:
        default:
          pipeline_type: vp9software
          width: 1920
          height: 1080
