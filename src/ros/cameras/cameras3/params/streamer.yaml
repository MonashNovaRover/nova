camera_streamer:
  ros__parameters:
    autostart: true
    serial_pipelines:

      # Development cameras
      anthony-cam:
        pipeline_type: h264passthrough
        width: 1920
        height: 1080
        framerate: 30

      # Mast
      mast_backward:
        meta : Mast - Backwards
      mast_arm_stow:
        meta: Mast - Arm Stow
      mast_down:
        meta: Mast - Down
      mast_forward:
        meta: Mast - Forwards

      # Science
      science_microscope:
        pipeline_type: vpXsoftware
        mime: video/x-raw
        width: 640
        framerate: 25
        meta: Science - Microscope
      science_gantry:
        meta: Science - Gantry
      science_spectrometer_top:
        meta: Science - Spectrometer (Top)
      science_spectrometer_side:
        meta: Science - Spectrometer (Side)
      science_backward:
        meta: Science - Butt
      science_shotglass:
        meta: Science - Shotglass
      science_rock_flipper:
        meta: Science - Rock flipper
      #science_spectroscope:
      #  autostart: false

      # Arm
      arm_gimbal:
        meta: Arm - Gimbal
      arm_end_forward:
        meta: Arm - Forward
      arm_end_top:
        meta: Arm - Top
      arm_end_finger:
        meta: Arm - Finger
      arm_end_side:
        meta: Arm - Side

    profiles:
      max:
        mime: image/jpeg
        width: 1920
        height: 1080
        framerate: 30
        bitrate: 1024
        cpu-used: -16
        speed-preset: ultrafast
        video_caps: video/x-vp8

      high:
        mime: image/jpeg
        width: 1024
        height: 768
        framerate: 30
        bitrate: 768
        cpu-used: -8
        speed-preset: fast
        video_caps: video/x-vp8

      high-cheap:
        mime: image/jpeg
        width: 1280
        height: 720
        framerate: 30
        bitrate: 768
        cpu-used: -8
        speed-preset: fast
        crop43: true
        video_caps: video/x-vp8

      high-life:
        mime: image/jpeg
        width: 800
        height: 600
        framerate: 30
        bitrate: 512
        cpu-used: -8
        speed-preset: fast
        video_caps: video/x-vp8

      medium:
        mime: image/jpeg
        width: 640
        height: 480
        framerate: 30
        bitrate: 384
        cpu-used: -4
        video_caps: video/x-vp8

      medium-cheap:
        mime: image/jpeg
        width: 1280
        height: 720
        framerate: 30
        downscale: 2
        bitrate: 384
        cpu-used: 0
        video_caps: video/x-vp8

      low:
        mime: image/jpeg
        width: 320
        height: 240
        framerate: 30
        bitrate: 256
        cpu-used: 10
        video_caps: video/x-vp9

      low-cheap:
        mime: image/jpeg
        width: 1280
        height: 720
        framerate: 30
        downscale: 3
        bitrate: 256
        cpu-used: 10
        video_caps: video/x-vp9

      low-focus:
        mime: image/jpeg
        width: 640
        height: 480
        framerate: 30
        downscale: 2
        bitrate: 256
        cpu-used: 10
        video_caps: video/x-vp9


    defaults:
      # Waveshare
      openaicam_openaicam_2505121128:
        pipeline_type: vpXsoftware
        width: 1280
        height: 720
        crop43: true
        framerate: 30
        noise_reduction: 128

      webcamvendor_SK_series1_20220325JWGD2093:
        pipeline_type: h264passthrough
        width: 1920
        height: 1080
        framerate: 30
        noise_reduction: 1024
        payload_quirk: true

      HZ_USB_Camera_20220301104:
        pipeline_type: vpXsoftware
        width: 1024
        height: 768
        framerate: 30
        noise_reduction: 256
        brightness: 256

      # Legacy
      Microsoft_Microsoft®_LifeCam_HD-3000:
        pipeline_type: vpXsoftware
        width: 800
        height: 600
        framerate: 30
        noise_reduction: 128

      # Name violates yaml rules
      # Ricoh_Company__Ltd._RICOH_THETA_Z1_34122798:
      #  pipeline_type: h264passthrough
      #  width: 3840
      #  height: 1920
      #  framerate: 30000
      #  framerate_denominator: 1001
      #  noise_reduction: 256

