camera_streamer:
  ros__parameters:
    autostart: false
    serial_pipelines:

      # Development cameras
      anthony-cam:
        pipeline_type: h264passthrough
        width: 1920
        height: 1080
        framerate: 30

      # Mast
      mast_backward:
        meta : Mast - Backwards
      mast_arm_stow:
        meta: Mast - Arm Stow
      mast_down:
        meta: Mast - Down
      mast_forward:
        meta: Mast - Forwards

      # Science
      science_microscope:
        pipeline_type: vpXsoftware
        mime: video/x-raw
        width: 640
        framerate: 25
        meta: Science - Microscope
      science_gantry:
        meta: Science - Gantry
      science_spectrometer_top:
        meta: Science - Spectrometer (Top)
      science_spectrometer_side:
        meta: Science - Spectrometer (Side)
      science_backward:
        meta: Science - Butt
      science_shotglass:
        meta: Science - Shotglass
      science_rock_flipper:
        meta: Science - Rock flipper
      #science_spectroscope:
      #  autostart: false

      # Arm
      arm_gimbal:
        meta: Arm - Gimbal
      arm_end_forward:
        meta: Arm - Forward
      arm_end_top:
        meta: Arm - Top
      arm_end_finger:
        meta: Arm - Finger
      arm_end_side:
        meta: Arm - Side

    profiles:
      openaicam_openaicam_2505121128:
        nav:
          pipeline_type: vp8software
          mime: image/jpeg
          width: 1280
          height: 720
          framerate: 30
          downscale: 2
          cpu_usage: 0
          bitrate: 512
        super:
          pipeline_type: h264software
          mime: image/jpeg
          width: 1920
          height: 1080
          framerate: 30
          crop43: false
          cpu_usage: 9
          jpegdec_method: float
          bitrate: 3072
          threads: 6
          gop: 3
        snail:
          pipeline_type: vp9software
          mime: image/jpeg
          width: 1280
          height: 720
          framerate: 30
          downscale: 6
          cpu_usage: 0
          bitrate: 192
        help:
