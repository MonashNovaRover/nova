camera_directory:
  ros__parameters:
    blacklist:
      # The RealSense cameras expose many video device nodes, all with the same serial number and USB device path. This is incompatible with the design of the camera_directory node.
      - Intel_R__RealSense_TM__Depth_Camera_455_Intel_R__RealSense_TM__Depth_Camera_455_210523060485
      - Intel_R__RealSense_TM__Depth_Camera_455_Intel_R__RealSense_TM__Depth_Camera_455 # Jetson TX2 does not see the serial number??
    serial_overrides:
      platform_roots:
        aftershock_laptop:
          "pci-0000:00:14.0-usb-0:9": mast    # USB slot on left of computer - right slot.
          "pci-0000:00:14.0-usb-0:4": payload # USB slot on left of computer - left slot.
        intel_laptop:
          "pci-0000:00:14.0-usb-0:1": mast
          "pci-0000:00:14.0-usb-0:2": payload
        orin:
          "platform-3610000.usb-usb-0:3": mast
          "platform-3610000.usb-usb-0:2": payload
        orin_dev_board:
          "platform-3610000.xhci-usb-0:2.1": mast
          "platform-3610000.xhci-usb-0:2.2": payload 
          # Expected USB slots:
          # -------------------------------------
          # ---- | Mast hub     |      | --------
          # HDMI | Payload hub  |      | ETHERNET
          # -------------------------------------
        rover:
          "platform-3530000.xhci-usb-0:1": mast
          "platform-3530000.xhci-usb-0:3": payload
        tx2_dev_board:
          "platform-3530000.xhci-usb-0:2": mast

      default_paths:
        mast:
          '1:1.0': mast_arm_stow
          '2:1.0': mast_down
          '3:1.0': mast_forward
          '4:1.0': mast_backward
        payload:
          '1:1.0': payload_1
          '2:1.0': payload_2
          '3:1.0': payload_3
          '4:1.0': payload_4
      
      payload_paths:
        science-arc:
          payload_3: science_gimbal_cam     # science hub port 1
          payload_2: science_kiln           # science hub port 2
          payload_1: science_kiln_bottom    # science hub port 3
          payload_4: science_microscope     # science hub port 4  
        science-urc:
          payload_1: science_gimbal_cam
          payload_2: science_microscope
          payload_3: science_spectroscope
          '4.1:1.0': science_cuvettes
        arm:
          payload_1: arm_end_finger
          payload_2: arm_end_side
          payload_3: arm_end_periscope
          payload_4: arm_end_top
        ec:
          payload_4: ec_scraper             # ec hub 1 -> camera in USB position 1 as labeled on the E&C CAMS USB Hub
          payload_3: ec_forklift_down       # ec hub 2
          payload_2: ec_forklift_forward    # ec hub 3
          payload_1: ec_scraper_leg         # ec hub 4

    # examples of serial remaps
    # serial_remaps:
      # 046d_HD_Pro_Webcam_C920_D113139F: anthony-cam
      # SunplusIT_Inc_ACER_FHD_User_Facing_01.00.00: brandon-cam
