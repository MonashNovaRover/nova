camera_streamer:
  ros__parameters:
    autostart: true

    serial_pipelines:
      # Waveshare
      openaicam_openaicam_2505121128:
        pipeline_type: h264software
        width: 1920
        height: 1080
        framerate: 30
        bitrate: 800000
        video_caps: video/x-h264,profile=high-10-intra
      webcamvendor_SK_series1_20220325JWGD2093:
        pipeline_type: h264passthrough
        payload_quirk: true
        width: 1920
        height: 1080
        framerate: 30
      HZ_USB_Camera_20220301104:
        pipeline_type: h264software
        width: 1920
        height: 1080
        framerate: 30
        bitrate: 800000
        video_caps: video/x-h264,profile=high-10-intra
      brandon-cam:
        pipeline_type: h264software
        mime: image/jpeg
        device: /dev/video0
        width: 1920
        height: 1080
        framerate: 30
        video_caps: video/x-h264,profile=high-4:2:2-intra
        platform: laptop

      anthony-cam:
        pipeline_type: h264passthrough
        width: 1920
        height: 1080
        framerate: 30
