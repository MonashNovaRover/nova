camera_streamer:
  ros__parameters:
    defaults:
      mime: image/jpeg
      width: 800
      framerate: 30
      profiles:
        snail:
          width: 320
          framerate: 7.5
        super:
          width: 1280
          framerate: 10

    cameras:
      # New cameras
      cheap-cam:
        mime: image/jpeg
        width: 1920
        framerate: 30
        show_clock: false
      autofocus-cam:
        mime: image/jpeg
        width: 1920
        framerate: 30
        show_clock: false
      fisheye-cam:
        mime: video/x-h264
        width: 1920
        framerate: 30
        show_clock: false
      SunplusIT_Inc_ACER_FHD_User_Facing_01.00.00:
        mime: image/jpeg
        width: 1920
        framerate: 30
        show_clock: false
        # bitrate: 1000000
        # video_caps: video/x-h264
      SYX_Hua_Que_200901010001:
        mime: image/jpeg
        width: 1920
        framerate: 30
        show_clock: false
      # Mast
      mast_backward:
        meta:
          uiProps:
            name: Mast - Backwards
      mast_arm_stow:
        meta:
          uiProps:
            name: Mast - Arm Stow
      mast_down:
        meta:
          uiProps:
            name: Mast - Down
      mast_forward:
        meta:
          uiProps:
            name: Mast - Forwards

      # Science
      science_microscope:
        mime: video/x-raw
        width: 640
        framerate: 25
        show_clock: false
        meta:
          uiProps:
            name: Science - Microscope
            rotation: 180
      science_gantry:
        meta:
          uiProps:
            name: Science - Gantry
            rotation: 180
      science_spectrometer_top:
        meta:
          uiProps:
            name: Science - Spectrometer (Top)
      science_spectrometer_side:
        meta:
          uiProps:
            name: Science - Spectrometer (Side)
            rotation: 180
      science_backward:
        meta:
          uiProps:
            name: Science - Butt
            rotation: 180
      science_shotglass:
        meta:
          uiProps:
            name: Science - Shotglass
      science_rock_flipper:
        meta:
          uiProps:
            name: Science - Rock flipper
      science_spectroscope:
        autostart: false

      # Arm
      arm_gimbal:
        meta:
          uiProps:
            name: Arm - Gimbal
      arm_end_forward:
        meta:
          uiProps:
            name: Arm - Forward
            mirrorX: true
      arm_end_top:
        meta:
          uiProps:
            name: Arm - Top
      arm_end_finger:
        meta:
          uiProps:
            name: Arm - Finger
      arm_end_side:
        meta:
          uiProps:
            name: Arm - Side
      arm_end_periscope:
        meta:
          # used for auto typing 2025
          ros_topic: "/arm/periscope"
