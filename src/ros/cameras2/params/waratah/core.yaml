camera_directory:
  ros__parameters:
    blacklist:
      # The RealSense cameras expose many video device nodes, all with the same serial number and USB device path.
      # This is incompatible with the design of the camera_directory node.
      - Intel_R__RealSense_TM__Depth_Camera_455_Intel_R__RealSense_TM__Depth_Camera_455_210523060485
    serial_overrides:
      paths:
        mast:
          '1:1.0': mast_forward
          '2:1.0': mast_down
          '3:1.0': mast_arm_stow
          '4:1.0': mast_backward
        science:
          '2:1.0': science_microscope
          '4.1:1.0': science_payload
          '4.2:1.0': science_backward
          '3:1.0': science_spectrometer_top
        arm:
          '1:1.0': arm_gimbal
          '2.1:1.0': arm_end_forward
          '2.2:1.0': arm_end_top
          '2.3:1.0': arm_end_finger
          '2.4:1.0': arm_end_screw

camera_streamer:
  ros__parameters:
    defaults:
      width: 640
      framerate: 10

    cameras:
      # Mast
      mast_backward:
        meta:
          uiProps:
            name: Mast - Backwards
      mast_arm_stow:
        meta:
          uiProps:
            name: Mast - Arm Stow
      mast_down:
        meta:
          uiProps:
            name: Mast - Down
      mast_forward:
        meta:
          uiProps:
            name: Mast - Forwards

      # Science
      science_microscope:
        meta:
          uiProps:
            name: Science - Microscope
      science_payload:
        meta:
          uiProps:
            name: Science - Payload
      science_spectrometer_top:
        meta:
          uiProps:
            name: Science - Spectrometer (Top)
      science_backward:
        meta:
          uiProps:
            name: Science - Butt

      # Arm
      arm_gimbal:
        meta:
          uiProps:
            name: Arm - Gimbal
      arm_end_screw:
        meta:
          uiProps:
            name: Arm - Screw
            mirrorX: true
      arm_end_top:
        meta:
          uiProps:
            name: Arm - Top
      arm_end_finger:
        meta:
          uiProps:
            name: Arm - Finger
      arm_end_forward:
        meta:
          uiProps:
            name: Arm - Forwards
