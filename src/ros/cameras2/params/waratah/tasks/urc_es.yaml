camera_streamer:
  ros__parameters:
    defaults:
      autostart: false

    cameras:
      arm_gimbal.autostart: true
      mast_down.autostart: true
      arm_end_side.autostart: true
      mast_arm_stow.autostart: true
      arm_end_forward.autostart: true
      mast_forward.autostart: true
      arm_end_top.autostart: true
      arm_end_finger.autostart: true
      mast_backward.autostart: true
