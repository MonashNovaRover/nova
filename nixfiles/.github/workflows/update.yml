jobs:
  get-latest-overlay:
    name: Get latest nix-ros-overlay
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.latest.outputs.sha }}
    steps:
      - name: nixpkgs
        run: |
          curl -=s https://github.com/lopsided98/nix-ros-overlay/blob/develop/flake.lock -o flake.json
          cat flake.json
          NIXPKGS_REV=$(jq -r '.nodes.nixpkgs.locked.rev' flake.json)
          # NIXPKGS_HASH=$(jq -r '.nodes.nixpkgs.locked.narHash' flake.json)
          echo $NIXPKGS_REV
          echo $NIXPKGS_HASH
      - name: whats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NIX_ROS_OVERLAY_SHA=$(gh api /repos/lopsided98/nix-ros-overlay/commits/main --jq '.sha')
          echo $NIX_ROS_OVERLAY_SHA

